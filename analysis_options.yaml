include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
  errors:
    unused_import: warning
    unused_local_variable: warning
    dead_code: warning
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - scripts/**

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - avoid_print
    - prefer_single_quotes

<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FataBlock - Kaydırmalı Blok Bulmaca Oyunu">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FataBlock">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Viewport settings to disable zoom and browser moves -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FataBlock</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Prevent scrolling, pull-to-refresh, zoom and text-selection */
    html, body {
      overscroll-behavior: none;
      height: 100dvh;
      margin: 0;
      padding: 0;
      background-color: #E9F8F1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    * {
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas, flt-glass-pane {
      touch-action: none;
    }

    /* PWA Splash screen style */
    #splash-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      background: linear-gradient(165deg, #E9F8F1 0%, #E4F1FA 50%, #EDEBFB 100%);
      transition: opacity 250ms ease-out;
    }

    #splash-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 3px;
      color: #1C2D35;
      margin-bottom: 20px;
    }

    #progress-bar-container {
      width: 140px;
      height: 4px;
      background-color: rgba(28, 45, 53, 0.1);
      border-radius: 2px;
      overflow: hidden;
    }

    #progress-bar {
      width: 100%;
      height: 100%;
      background-color: #19BFA0;
      border-radius: 2px;
      transform: translateX(-100%);
      animation: progress-slide 1.5s infinite ease-in-out;
    }

    @keyframes progress-slide {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(0%); }
      100% { transform: translateX(100%); }
    }
  </style>

  <script>
    // 1. PWA Installation Event Listener
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    window.canInstallPwa = function() {
      return deferredPrompt !== null;
    };

    window.triggerPwaInstall = function() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            deferredPrompt = null;
          }
        });
      }
    };

    // 2. Share API and Clipboard fallbacks
    window.isShareSupported = function() {
      return !!navigator.share;
    };

    window.shareText = function(text) {
      if (navigator.share) {
        navigator.share({ text: text }).catch(() => {});
        return true;
      } else {
        // Fallback: Copy to clipboard
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
          document.execCommand('copy');
        } catch (err) {}
        document.body.removeChild(textArea);
        return false;
      }
    };

    // Disable long press context menu
    window.addEventListener('contextmenu', e => e.preventDefault());
  </script>
</head>
<body>
  <!-- Splash Screen Container -->
  <div id="splash-container">
    <div id="splash-title">FATABLOCK</div>
    <div id="progress-bar-container">
      <div id="progress-bar"></div>
    </div>
  </div>

  <script>
    // Bootstrapping: Fade out splash once first frame loads
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
            
            // Fade out and remove splash screen
            setTimeout(() => {
              const splash = document.getElementById('splash-container');
              if (splash) {
                splash.style.opacity = '0';
                setTimeout(() => splash.remove(), 250);
              }
            }, 50);
          });
        }
      });
    });
  </script>
</body>
</html>
